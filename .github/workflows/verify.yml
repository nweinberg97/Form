name: Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: form
          POSTGRES_PASSWORD: form
          POSTGRES_DB: form
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U form" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://form:form@localhost:5432/form
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare results folder
        run: mkdir -p ci-out/logs ci-out/screens
      - name: Install
        id: install
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then npm ci 2>&1 | tee ci-out/logs/install.txt; else npm install 2>&1 | tee ci-out/logs/install.txt; fi
          exit ${PIPESTATUS[0]}
      - name: Generate migrations
        id: generate
        continue-on-error: true
        run: |
          npx drizzle-kit generate 2>&1 | tee ci-out/logs/generate.txt
          exit ${PIPESTATUS[0]}
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          npx tsc --noEmit -p . 2>&1 | tee ci-out/logs/typecheck.txt
          exit ${PIPESTATUS[0]}
      - name: Migrate + seed library
        id: migrate
        continue-on-error: true
        run: |
          npm run db:migrate 2>&1 | tee ci-out/logs/migrate.txt
          exit ${PIPESTATUS[0]}
      - name: Build
        id: build
        continue-on-error: true
        run: |
          npm run build 2>&1 | tee ci-out/logs/build.txt
          exit ${PIPESTATUS[0]}
      - name: Build browser demo
        id: demo_build
        continue-on-error: true
        run: |
          npm run demo:build 2>&1 | tee ci-out/logs/demo-build.txt
          code=${PIPESTATUS[0]}
          echo "${{ github.sha }}" > dist-demo/version.txt
          exit $code
      - name: Typecheck browser demo
        id: demo_typecheck
        continue-on-error: true
        run: |
          npm run demo:typecheck 2>&1 | tee ci-out/logs/demo-typecheck.txt
          exit ${PIPESTATUS[0]}
      - name: End-to-end (browser demo)
        id: e2e
        if: steps.demo_build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium > ci-out/logs/playwright-install.txt 2>&1
          (npx vite preview --config demo/vite.config.ts --port 4173 --strictPort > ci-out/logs/preview.txt 2>&1 &)
          npx wait-on -t 60000 http://localhost:4173/
          node scripts/e2e-demo.mjs http://localhost:4173/ ci-out/screens 2>&1 | tee ci-out/logs/e2e.txt
          exit ${PIPESTATUS[0]}
      - name: Smoke test (full server app)
        id: server_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          (npm run start > ci-out/logs/server.txt 2>&1 &)
          npx wait-on -t 90000 http://localhost:3000
          for path in / /login /signup /demo /app /clinic; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$path $code" | tee -a ci-out/logs/server-smoke.txt
          done
          ! grep -E " 5[0-9][0-9]$" ci-out/logs/server-smoke.txt
      - name: Publish demo to gh-pages branch (served by GitHub Pages)
        if: steps.demo_build.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd dist-demo
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Browser demo for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Publish results to ci-results branch
        if: always()
        run: |
          cat > ci-out/SUMMARY.txt <<SUM
          commit: ${{ github.sha }}
          install: ${{ steps.install.outcome }}
          generate: ${{ steps.generate.outcome }}
          typecheck: ${{ steps.typecheck.outcome }}
          migrate: ${{ steps.migrate.outcome }}
          build: ${{ steps.build.outcome }}
          demo_build: ${{ steps.demo_build.outcome }}
          demo_typecheck: ${{ steps.demo_typecheck.outcome }}
          e2e: ${{ steps.e2e.outcome }}
          server_smoke: ${{ steps.server_smoke.outcome }}
          SUM
          cp package-lock.json ci-out/ 2>/dev/null || true
          cp -r drizzle ci-out/drizzle 2>/dev/null || true
          cp ci-out/screens/../e2e-report.txt ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q -b ci-results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

  live:
    # Opens the public GitHub Pages site (once it has picked up this commit)
    # and runs the same end-to-end walkthrough against it.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1 > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
      - name: Wait for the live site to serve this commit
        id: wait
        continue-on-error: true
        run: |
          mkdir -p live-out
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY##*/}"
          for url in "https://$owner.github.io/$repo/" "https://$owner.github.io/$(echo $repo | tr 'A-Z' 'a-z')/"; do
            for i in $(seq 1 36); do
              got=$(curl -fsSL "${url}version.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]')
              if [ "$got" = "${{ github.sha }}" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; echo "LIVE $url" | tee live-out/status.txt; exit 0; fi
              echo "$url -> ${got:-not available yet} (attempt $i)"
              sleep 10
            done
          done
          echo "NOT LIVE: GitHub Pages is not serving this commit. Is Pages enabled (Settings -> Pages -> Deploy from branch gh-pages)?" | tee live-out/status.txt
          curl -sI "https://$owner.github.io/$repo/" | head -1 | tee -a live-out/status.txt
          exit 1
      - name: Walk through the live demo
        id: e2e
        if: steps.wait.outcome == 'success'
        continue-on-error: true
        run: |
          node scripts/e2e-demo.mjs "${{ steps.wait.outputs.url }}" live-out/screens 2>&1 | tee live-out/e2e.txt
          exit ${PIPESTATUS[0]}
      - name: Publish live-check results
        if: always()
        run: |
          echo "commit: ${{ github.sha }}" > live-out/SUMMARY.txt
          echo "live: ${{ steps.wait.outcome }} ${{ steps.wait.outputs.url }}" >> live-out/SUMMARY.txt
          echo "e2e: ${{ steps.e2e.outcome }}" >> live-out/SUMMARY.txt
          cd live-out
          git init -q -b ci-live
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Live check for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-live
